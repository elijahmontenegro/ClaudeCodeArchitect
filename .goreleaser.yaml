version: 2

project_name: cca

before:
  hooks:
    # Check downloaded modules against go.sum. CI fails an untidy go.mod,
    # so the release never rewrites it.
    - go mod verify

builds:
  - id: cca
    main: ./cmd/cca
    binary: cca
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: cca
    ids:
      - cca
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: elijahmontenegro
    name: ClaudeCodeArchitect
