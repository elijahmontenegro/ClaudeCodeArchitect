version: '3'

tasks:
  build:
    desc: Build cca binary
    cmds:
      - go build -o bin/cca{{if eq OS "windows"}}.exe{{end}} ./cmd/cca
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - go.mod
    generates:
      - bin/cca{{if eq OS "windows"}}.exe{{end}}

  install:
    desc: Install cca to GOPATH/bin
    cmds:
      - go install ./cmd/cca

  test:
    desc: Run cca against the relay example
    dir: examples/relay
    cmds:
      - cca validate
      - cca list
      - cca impact retention-days

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f bin/cca{{if eq OS "windows"}}.exe{{end}}
      - go clean
